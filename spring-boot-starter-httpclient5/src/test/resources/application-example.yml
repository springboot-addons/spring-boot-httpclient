# Example configuration for spring-boot-httpclient5
# This demonstrates all major configuration options

# Base application properties
app.httpbin-host: http://localhost:8080

logging:
  level:
    io.github.springboot.httpclient5.core: DEBUG

spring:
  threads.virtual.enabled: true
  application:
    name: example-springboot-httpclient5
  httpclient5:
    # Basic configuration
    user-agent: HttpClient5/ExampleApp
    jmx.domain: ${spring.application.name}
    
    # HTTP/1.0 specific configuration
    http1:
      buffer-size: 8192
      waitForContinueTimeout: PT60S
    
    # Async connection pool configuration
    async-pool:
      max-connper-route: 25
      dns-resolver: system
      conn-pool-policy: LIFO
      connection-time-to-live: PT180S
      pool-concurrency-policy: LAX
      # Default connection configuration for async pool
      default-connection-config:
        connect-timeout: PT0.2S
        socket-timeout: PT20S
      # Default socket configuration for async pool
      default-socket-config:
        so-timeout: PT300S
      # Host-specific configurations for async pool
      host-config:
        '[${app.httpbin-host}]':
          connect-timeout: PT0.7S
          max-connections: 20
        '[https://testhost:4443]':
          connect-timeout: PT0.4S
          max-connections: 50
    
    # Synchronous connection pool configuration  
    pool:
      max-conn-total: 256
      max-connper-route: 40
      dns-resolver: system
      conn-pool-policy: LIFO
      connection-time-to-live: PT180S
      pool-concurrency-policy: STRICT
      # Default connection configuration for sync pool
      default-connection-config:
        connect-timeout: PT0.7S
        socket-timeout: PT45S
      # Default socket configuration for sync pool
      default-socket-config:
        so-timeout: PT120S
      # Host-specific configurations for sync pool
      host-config:
        '[${app.httpbin-host}]':
          connect-timeout: PT1.5S
          max-connections: 15
        '[https://testhost:4443]':
          connect-timeout: PT2.5S
          max-connections: 30
    
    # Request configuration (matches based on method + URI pattern)
    request-config:
      # Default request configuration applied to all requests
      '[default]':
        connection-keep-alive: PT60S
        connection-request-timeout: PT2S
        response-timeout: PT5S
        retry-config:
          max-retries: 3
          retry-interval: PT5S
        interceptors:
          '[myinter]': false
        custom-request-context:
          '[propA]': "default-value"
      
      # Specific configuration for GET requests to httpbin host
      '[GET ${app.httpbin-host}/.*]':
        response-timeout: 30000
        interceptors:
          '[myinter]': true
          '[tu-interceptor]': true
        custom-request-context:
          '[propA]': "surcharge"
          '[propB]': "newOne"
      
      # Specific configuration for GET requests with basic auth
      '[GET ${app.httpbin-host}/basic-auth/.*]':
        credentials: admin:pwd
        #credentials: BASIC(admin:pwd)
      
      # Specific configuration for GET requests with preemptive auth
      '[GET ${app.httpbin-host}/hidden-basic-auth/.*]':
        credentials: PREEMPTIVE(admin:pwd)
      
      # Specific configuration for POST requests to httpbin host
      '[POST ${app.httpbin-host}/.*]':
        response-timeout: 15000
      
      # Specific configuration for requests with proxy
      '[.* https://testhost:4443/.*]':
        proxy: https://localhost:3128
      
      # Specific configuration for requests to testhost
      '[.* https://testhost/.*]':
        response-timeout: 2000
      
      # Specific configuration for POST requests to subpath on testhost
      '[POST https://testhost/subpath/.*]':
        response-timeout: 5000